spring.application.name=company-search
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/company_search}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

companies-house.base-url=https://find-and-update.company-information.service.gov.uk
companies-house.user-agent=CompanyDataSearchService/1.0 (interview project; contact: example@example.com)
companies-house.request-delay=500ms
companies-house.timeout=15s
companies-house.cache-ttl=24h
companies-house.max-companies-per-query=100
